name: mirror_logic
description: Mirror Logic — optical puzzle. Reflect, align, solve.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^15.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  audioplayers: ^6.4.0
  path_provider: ^2.1.5
  collection: ^1.19.1
  uuid: ^4.5.1
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/levels.json
    - assets/images/medieval/
    - assets/images/ui/
    - assets/audio/sfx/
    - assets/audio/music/
