name: mirror_logic
description: Mirror Logic — optical puzzle. Reflect, align, solve.
publish_to: 'none'
version: 8.0.0+8

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^15.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  audioplayers: ^6.4.0
  path_provider: ^2.1.5
  collection: ^1.19.1
  uuid: ^4.5.1
  google_mobile_ads: ^9.0.0
  in_app_review: ^2.0.12
  in_app_update: ^5.0.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  firebase_core: ^4.13.0
  firebase_remote_config: ^6.5.6
  firebase_analytics: ^12.5.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Every shipped file is listed one by one on purpose. Globbing the asset
  # folders used to bundle the PNG/WAV masters and unused art variants too,
  # which cost ~45 MB of APK for files the game never loads. Regenerate these
  # from the masters with `python3 tool/optimize_assets.py`.
  assets:
    # Level catalog is split into 10-level batches (manifest.json + batch_XXX.json).
    - assets/levels/
    - assets/notifications/notifications.json

    - assets/images/medieval/crystal_cut.webp
    - assets/images/medieval/emitter_cut.webp
    - assets/images/medieval/torch_base_cut.webp
    - assets/images/medieval/torch_cut.webp
    - assets/images/medieval/vine_cut.webp
    - assets/images/medieval/wall_h_cut.webp
    - assets/images/medieval/wall_v_cut.webp

    - assets/images/ui/crest.webp
    - assets/images/ui/padlock.webp
    - assets/images/ui/tome.webp
    - assets/images/ui/wreath.webp
    - assets/images/ui/tome_ch1.webp
    - assets/images/ui/tome_ch2.webp
    - assets/images/ui/tome_ch3.webp
    - assets/images/ui/tome_ch4.webp
    - assets/images/ui/tome_ch5.webp
    - assets/images/ui/tome_ch6.webp
    - assets/images/ui/tome_ch7.webp
    - assets/images/ui/tome_ch8.webp
    - assets/images/ui/tome_ch9.webp
    - assets/images/ui/tome_ch10.webp

    - assets/images/themes/golden_sun/floor.webp
    - assets/images/themes/golden_sun/wall_h.webp
    - assets/images/themes/golden_sun/wall_v.webp
    - assets/images/themes/golden_sun/thumb.webp
    - assets/images/themes/moonlight_castle/floor.webp
    - assets/images/themes/moonlight_castle/wall_h.webp
    - assets/images/themes/moonlight_castle/wall_v.webp
    - assets/images/themes/moonlight_castle/atmosphere.webp
    - assets/images/themes/moonlight_castle/thumb.webp
    - assets/images/themes/lava_forge/floor.webp
    - assets/images/themes/lava_forge/wall_h.webp
    - assets/images/themes/lava_forge/wall_v.webp
    - assets/images/themes/lava_forge/atmosphere.webp
    - assets/images/themes/lava_forge/crystal.webp
    - assets/images/themes/lava_forge/thumb.webp
    - assets/images/themes/frozen_kingdom/floor.webp
    - assets/images/themes/frozen_kingdom/wall_h.webp
    - assets/images/themes/frozen_kingdom/wall_v.webp
    - assets/images/themes/frozen_kingdom/atmosphere.webp
    - assets/images/themes/frozen_kingdom/thumb.webp
    - assets/images/themes/celestial_heaven/floor.webp
    - assets/images/themes/celestial_heaven/wall_h.webp
    - assets/images/themes/celestial_heaven/wall_v.webp
    - assets/images/themes/celestial_heaven/atmosphere.webp
    - assets/images/themes/celestial_heaven/thumb.webp

    - assets/audio/music/gameplay.ogg
    - assets/audio/music/menu.ogg

    - assets/audio/sfx/back.ogg
    - assets/audio/sfx/beam_hit.ogg
    - assets/audio/sfx/coin.ogg
    - assets/audio/sfx/crystal_lit.ogg
    - assets/audio/sfx/hint.ogg
    - assets/audio/sfx/mirror_detent.ogg
    - assets/audio/sfx/mirror_grab.ogg
    - assets/audio/sfx/mirror_lock.ogg
    - assets/audio/sfx/reject.ogg
    - assets/audio/sfx/star.ogg
    - assets/audio/sfx/tap.ogg
    - assets/audio/sfx/undo.ogg
    - assets/audio/sfx/unlock.ogg
    - assets/audio/sfx/win.ogg
